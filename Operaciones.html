<script>
// =====================================================
//  CONFIGURACION
// =====================================================
const SUPABASE_URL   = 'https://azlkmzmlcuwwujjuykzl.supabase.co';
const SUPABASE_ANON  = 'sb_publishable_mQ5qoAj7VXSvKPVR7MtFEQ_NpIh75lX';
const ALLOWED_DOMAIN = 'ocasa.com';
const MAIL_SEND_URL  = '/api/send-mail'; // tu endpoint para envío real de mails
// =====================================================

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

function toast(msg, type) {
  if (!type) type = 'info';
  var w = document.getElementById('toasts');
  var d = document.createElement('div');
  d.className = 'toast ' + type;
  d.textContent = msg;
  w.appendChild(d);
  setTimeout(function() { d.remove(); }, 3500);
}

// --- Helpers de fecha ---
function fmtDate(str) {
  if (!str) return '—';
  // acepta YYYY-MM-DD o YYYY-MM-DDTHH:mm
  var d = str.slice(0, 10).split('-');
  if (d.length < 3) return str;
  return d[2] + '/' + d[1] + '/' + d[0];
}
function today() { return new Date().toISOString().slice(0,10); }
function diffDays(from, to) {
  if (!from) return 0;
  var a = new Date(from), b = new Date(to || today());
  return Math.floor((b - a) / 86400000);
}

// --- Supabase ---
async function fetchAll() {
  var { data, error } = await sb.from('reclamos').select('*').order('creado', { ascending: false });
  if (error) throw error;
  return (data || []).map(function(r) {
    return Object.assign({}, r, { comments: r.comments || [], historial: r.historial || [] });
  });
}

async function updateT(id, fields) {
  var { error } = await sb.from('reclamos').update(fields).eq('id', id);
  if (error) throw error;
}

// --- Calcular días en análisis ---
function calcDias(ticket) {
  // dias_en_analisis acumulados + dias desde que inició el último período en análisis
  var base = ticket.dias_en_analisis || 0;
  if (ticket.estado === 'En análisis' && ticket.fecha_inicio_analisis) {
    base += diffDays(ticket.fecha_inicio_analisis, today());
  }
  return base;

function Ticketera(props) {

  const [q, setQ] = useState('');

  var tabs = [
    { id:'recibidos', label:'Recibidos', filter: function(t){ return t.estado==='Recibido'; } },
    { id:'analisis', label:'En análisis', filter: function(t){ return t.estado==='En análisis'; } },
    { id:'finalizados', label:'Finalizados', filter: function(t){ return t.estado==='Finalizado'; } },
    { id:'reabiertos', label:'Re abiertos', filter: function(t){ return t.estado==='Re abierto'; } },
  ];

  var currentTab = tabs.find(function(t){ return t.id===tab; }) || tabs[0];

  var filtered = useMemo(function() {
    var r = tickets.filter(currentTab.filter);
    // En análisis: ordenar de más viejo a más nuevo al final (más viejos primero)
    if (tab === 'analisis') r = r.slice().sort(function(a,b){ return (a.creado||'').localeCompare(b.creado||''); });
    if (q) r = r.filter(function(t) { return t.id.toLowerCase().includes(q.toLowerCase()) || (t.titular||'').toLowerCase().includes(q.toLowerCase()); });
    return r;
  }, [tickets, tab, q, currentTab]);

  function getRowClass(t) {
    if (tab !== 'recibidos') return '';
    return t.leido ? 'row-read' : 'row-unread';
  }

  return h('div', null,
    h('div',{className:'shdr'},
      h('h2',null,'Ticketera operativa'),
      h('input',{className:'search',placeholder:'Buscar ID o titular...',value:q,onChange:function(e){setQ(e.target.value);}})
    ),
    h('div',{className:'tab-bar'},
      tabs.map(function(t) {
        var count = tickets.filter(t.filter).length;
        return h('button',{
          key:t.id,
          className:'tab-btn'+(tab===t.id?' on':''),
          onClick:function(){setTab(t.id);}

          t.label,

      })

    h('div',{className:'tw'},
      h('table',null,

          h('th',null,'Días análisis')
        )),
        h('tbody',null,
          filtered.length === 0
            ? h('tr',null,h('td',{colSpan:7},h('div',{className:'empty'},h('div',{className:'empty-icon'},'📭'),h('p',null,'Sin resultados'))))
            : filtered.map(function(t) {

  const [saving, setSaving] = useState(false);
  const [mailTo, setMailTo] = useState('');
  const [mailCC, setMailCC] = useState('');
  const [mailBody, setMailBody] = useState('');
  const [mailFile, setMailFile] = useState(null);
  const [mailSent, setMailSent] = useState(false);
  const [mailSending, setMailSending] = useState(false);

  var dias = calcDias(lt);

  function getNow() { return new Date().toISOString().slice(0,16).replace('T',' '); }
  function sync(updated) { setLt(updated); setTickets(function(ts) { return ts.map(function(t) { return t.id === ticket.id ? updated : t; }); }); }

  async function changeEstado(estado) {
    setSaving(true);
    var now = today();
    var fields = { estado: estado };
    var extra = {};

    // Lógica de días en análisis
    if (estado === 'En análisis' && lt.estado !== 'En análisis') {
      extra.fecha_inicio_analisis = now;
    }
    if (estado !== 'En análisis' && lt.estado === 'En análisis' && lt.fecha_inicio_analisis) {
      // Acumular días y resetear fecha_inicio
      var acum = (lt.dias_en_analisis || 0) + diffDays(lt.fecha_inicio_analisis, now);
      extra.dias_en_analisis = acum;
      extra.fecha_inicio_analisis = null;
    }
    // Re abierto: reactivar conteo
    if (estado === 'Re abierto') {
      extra.fecha_inicio_analisis = now;
    }

    Object.assign(fields, extra);

    var newH = { ts: getNow(), accion: 'Estado: ' + estado, usuario: 'Operaciones' };
    var updated = Object.assign({}, lt, fields, { historial: (lt.historial || []).concat([newH]) });
    if (extra.dias_en_analisis !== undefined) updated.dias_en_analisis = extra.dias_en_analisis;

    try { await updateT(lt.id, Object.assign({}, fields, { historial: updated.historial })); } catch(e) { console.warn(e); }
    sync(updated); toast('Estado: ' + estado, 'ok'); setSaving(false);
  }

  async function markLeido() {
    if (lt.leido) return;
    var updated = Object.assign({}, lt, { leido: true });
    try { await updateT(lt.id, { leido: true }); } catch(e) {}
    sync(updated);
  }

  useEffect(function() { markLeido(); }, []);

  async function assignResp() {
    if (!resp) return; setSaving(true);
    var newH = { ts: getNow(), accion: 'Asignado a ' + resp, usuario: 'Operaciones' };
    try { await updateT(lt.id, { responsable: resp }); } catch(e) { console.warn(e); }
    sync(Object.assign({}, lt, { responsable: resp, historial: (lt.historial || []).concat([newH]) }));
    toast('Asignado a ' + resp, 'ok'); setSaving(false);
  }

  async function addComment() {
    if (!comment.trim()) return; setSaving(true);
    var c = { autor: 'Operaciones', ts: getNow(), texto: comment };
    var updated = Object.assign({}, lt, { comments: (lt.comments || []).concat([c]) });
    try { await updateT(lt.id, { comments: updated.comments }); } catch(e) { console.warn(e); }
    sync(updated); setComment(''); toast('Comentario guardado', 'ok'); setSaving(false);
  }

  async function sendMail() {
    if (!mailTo) { toast('Ingresá el destinatario', 'err'); return; }
    setMailSending(true);
    try {
      var formData = new FormData();
      formData.append('to', mailTo);
      formData.append('cc', mailCC);
      formData.append('subject', '[ReclamiOps] Informe — ' + lt.id + ' — ' + (lt.titular||''));
      formData.append('body', mailBody);
      if (mailFile) formData.append('file', mailFile);
      await fetch(MAIL_SEND_URL, { method: 'POST', body: formData });
      var newH = { ts: getNow(), accion: 'Informe enviado a: ' + mailTo, usuario: 'Operaciones' };
      var updated = Object.assign({}, lt, { historial: (lt.historial||[]).concat([newH]) });
      try { await updateT(lt.id, { historial: updated.historial }); } catch(e) {}
      sync(updated);
      setMailSent(true); toast('Mail enviado', 'ok');
    } catch(e) { toast('Error al enviar mail', 'err'); }
    setMailSending(false);
  }

  return h('div', { className:'overlay', onClick:function(e){ if(e.target.className==='overlay')onClose(); } },

            ),

          return h('div',{key:item[0],className:'ptab'+(tab===item[0]?' on':''),onClick:function(){setTab(item[0]);}},item[1]);

        ),

        tab==='cmts' && h('div',null,
          (lt.comments||[]).length===0 && h('p',{style:{fontSize:12,color:'var(--g400)',marginBottom:12}},'Sin comentarios.'),
          (lt.comments||[]).map(function(c,i) {
            return h('div',{key:i,className:'cc'},h('div',{className:'cc-author'},c.autor,h('span',{className:'cc-ts'},fmtDate(c.ts))),h('p',{className:'cc-text'},c.texto));
          }),
          h('textarea',{className:'cinp',placeholder:'Comentario interno...',value:comment,onChange:function(e){setComment(e.target.value);}}),
          h('div',{style:{marginTop:7}},h('button',{className:'btn btn-primary btn-sm',onClick:addComment,disabled:saving},saving?h('span',{className:'spinner'}):null,'Agregar'))
        ),

        tab==='acc' && h('div',null,
          // Asignar responsable
          h('div',{className:'dsec'},
            h('div',{className:'dsec-title'},'Asignar responsable'),
            h('div',{style:{display:'flex',gap:7,marginBottom:18}},
              h('select',{style:{flex:1,padding:'7px 10px',border:'1px solid var(--g200)',borderRadius:'var(--rad)',fontSize:12,fontFamily:'inherit',color:'var(--g900)',background:'var(--w)',outline:'none'},value:resp,onChange:function(e){setResp(e.target.value);}},
                h('option',{value:''},'— Seleccionar —'),
                DEMO_USERS.map(function(u){ return h('option',{key:u.id,value:u.nombre},u.nombre); })
              ),
              h('button',{className:'btn btn-primary btn-sm',onClick:assignResp,disabled:saving||!resp},'Asignar')
            )
          ),
          // Cambiar estado (solo En análisis y Finalizado)
          h('div',{className:'dsec'},
            h('div',{className:'dsec-title'},'Cambiar estado'),
            h('div',{className:'act-row'},
              ['En análisis','Finalizado'].map(function(e) {
                var isCurrent = lt.estado === e;
                return h('button',{
                  key:e,
                  className:'btn '+(e==='Finalizado'?'btn-success':'btn-ghost')+' btn-sm'+(isCurrent?' btn-primary':''),
                  onClick:function(){if(!isCurrent)changeEstado(e);},
                  disabled:saving||isCurrent,
                  style:isCurrent?{opacity:.6,cursor:'default'}:{}
                }, e==='Finalizado'?'✅ '+e:e);
              })
            )
          ),
          // Envío de informe comercial
          h('div',{className:'dsec'},
            h('div',{className:'dsec-title'},'Envío de informe comercial'),
            mailSent && h('div',{className:'al al-green',style:{marginBottom:10}},'✅ Informe enviado correctamente.'),
            h('div',{className:'mail-composer'},
              h('div',{className:'mc-header'},'✉ Redactar informe'),
              h('div',{className:'mc-body'},
                h('div',{className:'mc-field'},h('label',null,'Para:'),h('input',{type:'text',value:mailTo,onChange:function(e){setMailTo(e.target.value);},placeholder:'destinatario@mail.com'})),
                h('div',{className:'mc-field'},h('label',null,'CC:'),h('input',{type:'text',value:mailCC,onChange:function(e){setMailCC(e.target.value);},placeholder:'opcional'})),
                h('textarea',{className:'mc-textarea',placeholder:'Escribí el cuerpo del informe...',value:mailBody,onChange:function(e){setMailBody(e.target.value);}}),
                h('div',{className:'mc-attach'},
                  h('button',{className:'mc-attach-btn',onClick:function(){document.getElementById('mail-file-inp').click();}},
                    '📎 ', mailFile ? mailFile.name : 'Adjuntar archivo'
                  ),
                  h('input',{id:'mail-file-inp',type:'file',style:{display:'none'},onChange:function(e){if(e.target.files[0])setMailFile(e.target.files[0]);}})
                )
              )
            ),
            h('button',{className:'btn btn-primary',onClick:sendMail,disabled:mailSending||!mailTo},
              mailSending?h('span',{className:'spinner'}):null,
              '✉ Enviar informe'
            )
          )
        )
      )
    )
  );
}

function Config() {
  return h('div',null,
    h('div',{className:'shdr'},h('h2',null,'Configuración')),
    h('div',{className:'cfg'},h('h3',null,'Conexión'),
      h('div',{className:'cfg-row'},h('label',null,'Supabase URL'),h('input',{type:'text',defaultValue:SUPABASE_URL})),
      h('div',{className:'cfg-row'},h('label',null,'Dominio permitido'),h('input',{type:'text',defaultValue:ALLOWED_DOMAIN})),
      h('div',{className:'cfg-row'},h('label',null,'Endpoint envío mail'),h('input',{type:'text',defaultValue:MAIL_SEND_URL}))
    ),
    h('button',{className:'btn btn-primary',style:{marginTop:4}},'Guardar')
  );
}

function Users() {
  const [users, setUsers] = useState(DEMO_USERS);
  const [showAdd, setShowAdd] = useState(false);
  const [nu, setNu] = useState({ nombre:'', email:'', rol:'operaciones' });

  function add() {
    if (!nu.nombre || !nu.email) return;
    setUsers(function(u) { return u.concat([Object.assign({}, nu, { id:Date.now(), color:'#'+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0') })]); });
    setShowAdd(false); setNu({ nombre:'', email:'', rol:'operaciones' });
    toast('Usuario agregado', 'ok');
  }

  return h('div',null,
    h('div',{className:'shdr'},h('h2',null,'Usuarios'),h('button',{className:'btn btn-primary btn-sm',onClick:function(){setShowAdd(function(s){return !s;})}},'+ Nuevo')),
    showAdd && h('div',{className:'cfg',style:{marginBottom:12}},
      h('h3',null,'Nuevo usuario'),
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}},
        h('div',{style:{display:'flex',flexDirection:'column',gap:5}},
          h('label',{style:{fontSize:11,fontWeight:500,color:'var(--g700)'}},'Nombre'),
          h('input',{style:{padding:'7px 9px',border:'1px solid var(--g200)',borderRadius:'var(--rad)',fontSize:12,fontFamily:'inherit',color:'var(--g900)',background:'var(--w)',outline:'none'},type:'text',value:nu.nombre,onChange:function(e){setNu(function(n){return Object.assign({},n,{nombre:e.target.value});});}})),
        h('div',{style:{display:'flex',flexDirection:'column',gap:5}},
          h('label',{style:{fontSize:11,fontWeight:500,color:'var(--g700)'}},'Email'),
          h('input',{style:{padding:'7px 9px',border:'1px solid var(--g200)',borderRadius:'var(--rad)',fontSize:12,fontFamily:'inherit',color:'var(--g900)',background:'var(--w)',outline:'none'},type:'email',value:nu.email,onChange:function(e){setNu(function(n){return Object.assign({},n,{email:e.target.value});});}}))
      ),
      h('div',{style:{display:'flex',flexDirection:'column',gap:5,marginBottom:10}},
        h('label',{style:{fontSize:11,fontWeight:500,color:'var(--g700)'}},'Rol'),
        h('select',{style:{padding:'7px 9px',border:'1px solid var(--g200)',borderRadius:'var(--rad)',fontSize:12,fontFamily:'inherit',color:'var(--g900)',background:'var(--w)',outline:'none'},value:nu.rol,onChange:function(e){setNu(function(n){return Object.assign({},n,{rol:e.target.value});});}},
          h('option',{value:'operaciones'},'Operaciones'),
          h('option',{value:'supervisor'},'Supervisor')
        )
      ),
      h('button',{className:'btn btn-primary btn-sm',onClick:add},'Agregar')
    ),
    h('div',{className:'cfg'},
      users.map(function(u) {
        return h('div',{key:u.id,className:'urow'},
          h(Av,{name:u.nombre,color:u.color,size:28}),
          h('div',{style:{flex:1}},h('div',{className:'uname'},u.nombre),h('div',{className:'uemail'},u.email)),
          h('span',{className:'rtag rt-'+(u.rol==='supervisor'?'sup':'ops')},u.rol==='supervisor'?'Supervisor':'Operaciones'),
          h('button',{className:'btn btn-ghost btn-sm',style:{marginLeft:7,fontSize:10}},'Editar')
        );
      })
    )
  );
}

function App() {
  const [session, setSession] = useState(null);
  const [loading, setLoading] = useState(true);
  const [page, setPage] = useState('dashboard');
  const [tickets, setTickets] = useState(DEMO);
  const [sel, setSel] = useState(null);
  const [gsStatus, setGsStatus] = useState('load');

  useEffect(function() {
    sb.auth.getSession().then(function(result) { setSession(result.data.session); setLoading(false); });
    var sub = sb.auth.onAuthStateChange(function(_, s) { setSession(s); });
    return function() { sub.data.subscription.unsubscribe(); };
  }, []);

  useEffect(function() {
    if (!session) return;
    fetchAll()
      .then(function(data) {
        if (data.length) { setTickets(data); toast(data.length + ' tickets cargados', 'ok'); }
        else toast('Supabase OK — sin datos aún, mostrando demo', 'info');
        setGsStatus('ok');
      })
      .catch(function() { setGsStatus('err'); toast('Supabase no conectado — modo demo', 'err'); });
  }, [session]);

  if (loading) return h('div', { style:{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',color:'#9ca3af',fontSize:12} }, 'Cargando...');
  if (!session) return h(Login, { onLogin:function(s){setSession(s);} });

  var reabiertos = tickets.filter(function(t) { return t.estado === 'Re abierto'; }).length;
  var nav = [
    { id:'dashboard', lbl:'Dashboard', icon:'◈' },
    { id:'ticketera', lbl:'Ticketera', icon:'☰', badge: reabiertos || null },
    { id:'config', lbl:'Configuración', icon:'⚙' },
    { id:'usuarios', lbl:'Usuarios', icon:'👥' },
  ];
  var email = session.user ? session.user.email || '' : '';
  var pageTitles = { dashboard:'Dashboard operativo', ticketera:'Ticketera', config:'Configuración', usuarios:'Usuarios' };

  return h('div', { className:'app' },
    h('div',{className:'sidebar'},
      h('div',{className:'sb-logo'},
        h('div',{className:'sb-logo-icon'},'📦'),
        h('div',null,h('h1',null,'ReclamiOps'),h('p',null,'Operaciones'))
      ),
      h('div',{className:'sb-nav'},
        h('div',{className:'sb-section'},'Menú'),
        nav.map(function(item) {
          return h('div',{key:item.id,className:'nav-item'+(page===item.id?' active':''),onClick:function(){setPage(item.id);}},
            h('span',{className:'nav-icon'},item.icon),
            h('span',null,item.lbl),
            item.badge&&h('span',{className:'nav-badge'},item.badge)
          );
        })
      ),
      h('div',{className:'sb-footer'},
        h(Av,{name:email,color:'#2563eb',size:24}),
        h('span',{className:'sf-name'},email.split('@')[0]),
        h('button',{className:'btn-out',onClick:function(){sb.auth.signOut();}},'Salir')
      )
    ),
    h('div',{className:'main'},
      h('div',{className:'topbar'},
        h('h2',null,pageTitles[page]||page),
        reabiertos>0&&h('div',{style:{background:'var(--r50)',border:'1px solid var(--r100)',color:'var(--r600)',padding:'3px 9px',borderRadius:5,fontSize:10,fontWeight:600,cursor:'pointer'},onClick:function(){setPage('ticketera');}},'🔄 '+reabiertos+' re abierto'+(reabiertos>1?'s':'')),
        h('div',{className:'topbar-right'},
          h('div',{className:'sb-pill '+(gsStatus==='ok'?'ok':gsStatus==='err'?'err':'load')},
            h('div',{className:'sdot'+(gsStatus==='load'?' pulse':'')}),
            'Supabase '+(gsStatus==='load'?'...':gsStatus==='ok'?'OK':'Error')
          )
        )
      ),
      h('div',{className:'content'},
        page==='dashboard'&&h(Dashboard,{tickets:tickets,onOpen:setSel}),
        page==='ticketera'&&h(Ticketera,{tickets:tickets,onOpen:setSel}),
        page==='config'&&h(Config,{}),
        page==='usuarios'&&h(Users,{})
      )
    ),
    sel&&h(TicketPanel,{ticket:sel,setTickets:setTickets,onClose:function(){setSel(null);}})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
