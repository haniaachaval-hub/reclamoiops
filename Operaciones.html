<body>
<div id="root"></div>
<div class="toast-wrap" id="toasts"></div>
<script>
// =====================================================
//  CONFIGURACION — reemplazar con valores reales
// =====================================================
const SUPABASE_URL   = 'https://azlkmzmlcuwwujjuykzl.supabase.co';
const SUPABASE_ANON  = 'sb_publishable_mQ5qoAj7VXSvKPVR7MtFEQ_NpIh75lX';
const ALLOWED_DOMAIN = 'ocasa.com';
// =====================================================

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

function toast(msg, type) {
  if (!type) type = 'info';
  var w = document.getElementById('toasts');
  var d = document.createElement('div');
  d.className = 'toast ' + type;
  d.textContent = msg;
  w.appendChild(d);
  setTimeout(function() { d.remove(); }, 3500);
}

async function fetchAll() {
  const [p, s] = await Promise.all([
    sb.from('reclamos_postales').select('*').order('creado', { ascending: false }),
    sb.from('siniestros').select('*').order('creado', { ascending: false })
  ]);
  const postales = (p.data || []).map(function(r) { return Object.assign({}, r, { tipo: 'postal', comments: r.comments || [], historial: r.historial || [] }); });
  const sins = (s.data || []).map(function(r) { return Object.assign({}, r, { tipo: 'siniestro', comments: r.comments || [], historial: r.historial || [] }); });
  return postales.concat(sins).sort(function(a, b) { return (b.creado || '').localeCompare(a.creado || ''); });
}

async function updateT(id, tipo, fields) {
  const table = tipo === 'postal' ? 'reclamos_postales' : 'siniestros';
  const { error } = await sb.from(table).update(fields).eq('id', id);
  if (error) throw error;

function Users() {
  const [users, setUsers] = useState(DEMO_USERS);
  const [showAdd, setShowAdd] = useState(false);
  const [nu, setNu] = useState({ nombre:'', email:'', rol:'operaciones' });

  function add() {
    if (!nu.nombre || !nu.email) return;
    setUsers(function(u) { return u.concat([Object.assign({}, nu, { id:Date.now(), color:'#'+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0') })]); });
    setShowAdd(false); setNu({ nombre:'', email:'', rol:'operaciones' });
    toast('Usuario agregado', 'ok');
  }

  return h('div',null,
    h('div',{className:'shdr'},h('h2',null,'Usuarios'),h('button',{className:'btn btn-primary btn-sm',onClick:function(){setShowAdd(function(s){return !s;})}},'+ Nuevo')),
    showAdd && h('div',{className:'cfg',style:{marginBottom:12}},
      h('h3',null,'Nuevo usuario'),
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}},
        h('div',{style:{display:'flex',flexDirection:'column',gap:5}},
          h('label',{style:{fontSize:11,fontWeight:500,color:'var(--g700)'}},'Nombre'),
          h('input',{style:{padding:'7px 9px',border:'1px solid var(--g200)',borderRadius:'var(--rad)',fontSize:12,fontFamily:'inherit',color:'var(--g900)',background:'var(--w)',outline:'none'},type:'text',value:nu.nombre,onChange:function(e){setNu(function(n){return Object.assign({},n,{nombre:e.target.value});});}})),
        h('div',{style:{display:'flex',flexDirection:'column',gap:5}},
          h('label',{style:{fontSize:11,fontWeight:500,color:'var(--g700)'}},'Email'),
          h('input',{style:{padding:'7px 9px',border:'1px solid var(--g200)',borderRadius:'var(--rad)',fontSize:12,fontFamily:'inherit',color:'var(--g900)',background:'var(--w)',outline:'none'},type:'email',value:nu.email,onChange:function(e){setNu(function(n){return Object.assign({},n,{email:e.target.value});});}}))
      ),
      h('div',{style:{display:'flex',flexDirection:'column',gap:5,marginBottom:10}},
        h('label',{style:{fontSize:11,fontWeight:500,color:'var(--g700)'}},'Rol'),
        h('select',{style:{padding:'7px 9px',border:'1px solid var(--g200)',borderRadius:'var(--rad)',fontSize:12,fontFamily:'inherit',color:'var(--g900)',background:'var(--w)',outline:'none'},value:nu.rol,onChange:function(e){setNu(function(n){return Object.assign({},n,{rol:e.target.value});});}},
          h('option',{value:'operaciones'},'Operaciones'),
          h('option',{value:'supervisor'},'Supervisor')
        )
      ),
      h('button',{className:'btn btn-primary btn-sm',onClick:add},'Agregar')
    ),
    h('div',{className:'cfg'},
      users.map(function(u) {
        return h('div',{key:u.id,className:'urow'},
          h(Av,{name:u.nombre,color:u.color,size:28}),
          h('div',{style:{flex:1}},h('div',{className:'uname'},u.nombre),h('div',{className:'uemail'},u.email)),
          h('span',{className:'rtag rt-'+(u.rol==='supervisor'?'sup':'ops')},u.rol==='supervisor'?'Supervisor':'Operaciones'),
          h('button',{className:'btn btn-ghost btn-sm',style:{marginLeft:7,fontSize:10}},'Editar')
        );
      })
    )
  );
}

function App() {
  const [session, setSession] = useState(null);
  const [loading, setLoading] = useState(true);
  const [page, setPage] = useState('dashboard');
  const [tickets, setTickets] = useState(DEMO);
  const [sel, setSel] = useState(null);
  const [gsStatus, setGsStatus] = useState('load');

  useEffect(function() {
    sb.auth.getSession().then(function(result) { setSession(result.data.session); setLoading(false); });
    var sub = sb.auth.onAuthStateChange(function(_, s) { setSession(s); });
    return function() { sub.data.subscription.unsubscribe(); };
  }, []);

  useEffect(function() {
    if (!session) return;
    fetchAll()
      .then(function(data) {
        if (data.length) { setTickets(data); toast(data.length+' tickets cargados', 'ok'); }
        else toast('Supabase OK — sin datos aun, mostrando demo', 'info');
        setGsStatus('ok');
      })
      .catch(function() { setGsStatus('err'); toast('Supabase no conectado — modo demo', 'err'); });
  }, [session]);

  if (loading) return h('div', { style:{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',color:'#9ca3af',fontSize:12} }, 'Cargando...');
  if (!session) return h(Login, { onLogin:function(s){setSession(s);} });

  var venc = tickets.filter(function(t) { return t.sla_pct >= 100 && !['Cerrado','Finalizado'].includes(t.estado); }).length;
  var nav = [
    { id:'dashboard', lbl:'Dashboard', icon:'◈' },
    { id:'ticketera', lbl:'Ticketera', icon:'☰', badge:venc||null },
    { id:'config', lbl:'Configuracion', icon:'⚙' },
    { id:'usuarios', lbl:'Usuarios', icon:'👥' },
  ];
  var email = session.user ? session.user.email || '' : '';
  var pageTitles = { dashboard:'Dashboard operativo', ticketera:'Ticketera', config:'Configuracion', usuarios:'Usuarios' };

  return h('div', { className:'app' },
    h('div',{className:'sidebar'},
      h('div',{className:'sb-logo'},
        h('div',{className:'sb-logo-icon'},'📦'),
        h('div',null,h('h1',null,'ReclamiOps'),h('p',null,'Operaciones'))
      ),
      h('div',{className:'sb-nav'},
        h('div',{className:'sb-section'},'Menu'),
        nav.map(function(item) {
          return h('div',{key:item.id,className:'nav-item'+(page===item.id?' active':''),onClick:function(){setPage(item.id);}},
            h('span',{className:'nav-icon'},item.icon),
            h('span',null,item.lbl),
            item.badge&&h('span',{className:'nav-badge'},item.badge)
          );
        })
      ),
      h('div',{className:'sb-footer'},
        h(Av,{name:email,color:'#2563eb',size:24}),
        h('span',{className:'sf-name'},email.split('@')[0]),
        h('button',{className:'btn-out',onClick:function(){sb.auth.signOut();}},'Salir')
      )
    ),
    h('div',{className:'main'},
      h('div',{className:'topbar'},
        h('h2',null,pageTitles[page]||page),
        venc>0&&h('div',{style:{background:'var(--r50)',border:'1px solid var(--r100)',color:'var(--r600)',padding:'3px 9px',borderRadius:5,fontSize:10,fontWeight:600,cursor:'pointer'},onClick:function(){setPage('ticketera');}},'🚨 '+venc+' vencido'+(venc>1?'s':'')),
        h('div',{className:'topbar-right'},
          h('div',{className:'sb-pill '+(gsStatus==='ok'?'ok':gsStatus==='err'?'err':'load')},
            h('div',{className:'sdot'+(gsStatus==='load'?' pulse':'')}),
            'Supabase '+(gsStatus==='load'?'...':gsStatus==='ok'?'OK':'Error')
          )
        )
      ),
      h('div',{className:'content'},
        page==='dashboard'&&h(Dashboard,{tickets:tickets,onOpen:setSel}),
        page==='ticketera'&&h(Ticketera,{tickets:tickets,onOpen:setSel}),
        page==='config'&&h(Config,{}),
        page==='usuarios'&&h(Users,{})
      )
    ),
    sel&&h(TicketPanel,{ticket:sel,setTickets:setTickets,onClose:function(){setSel(null);}})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
