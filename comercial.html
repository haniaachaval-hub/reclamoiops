<style>

<body>
<div id="root"></div>
<div class="toast-wrap" id="toasts"></div>

<script>
// =====================================================================
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyA7sqhtTWarBX1WnitAttP7zEHK7GOKMv53sEXLIP_A2_KMBWTEgg5im36nwaJTRvh9Q/exec';
var GOOGLE_CLIENT_ID = '337424697739-d3mbqis7mpcao9r95imnfdq95uhboeur.apps.googleusercontent.com';
var ALLOWED_DOMAIN = 'ocasa.com';
var MAIL_OPERACIONES = 'hania.achaval@ocasa.com';
// =====================================================================

var currentUser = (function(){
  var token = sessionStorage.getItem("ro_token");
  var email = sessionStorage.getItem("ro_email");
  var name  = sessionStorage.getItem("ro_name");
  if (!token || !email) { window.location.href = "index.html"; return null; }
  var clientesRaw = sessionStorage.getItem("ro_clientes");
  var clientes = [];
  try { clientes = clientesRaw ? JSON.parse(clientesRaw) : []; } catch(e) { clientes = []; }
  return { token: token, email: email, name: name, clientes: clientes };
})();
var tickets = [];
var perfil = null;
var selectedTicket = null;
var searchQ = '';
var searchInput = ''; // valor del input antes de ejecutar la búsqueda con Enter/botón
var filtroCliente = '';
var filtroEstado = '';
var filtroFechaDesde = '';
var filtroFechaHasta = '';
var ordenFecha = 'desc'; // 'desc' = más reciente primero, 'asc' = más viejo primero
var ordenMonto = ''; // '' = sin orden, 'desc' = mayor primero, 'asc' = menor primero
var saving = false;
var showReopen = false;
var reopenMsg = '';
var loading = true;
// Texto nuevo / archivo nuevo en el panel de detalle, agregado por comercial
var detailComentario = '';
var detailArchivo = null;

// ── Estado de la vista actual: 'tickets' | 'nuevo' ──
var activeView = 'tickets';

// ── Estado del formulario de nuevo reclamo (portado de cliente.html) ──
var rfStep = 1;
var rfSaving = false;
var rfTicketId = '';
var rfEditField = null;
var rfForm = { titular:'', tipo_reclamo:'', detalle:'', monto:'' };
var rfExcelFiles = [];
var rfCarrierFiles = [];
var rfErrors = {};
var rfValidated = false;
var rfValidando = false;

function resetRfForm() {
  rfStep = 1; rfSaving = false; rfTicketId = ''; rfEditField = null;
  rfForm = { titular:'', tipo_reclamo:'', detalle:'', monto:'' };
  rfExcelFiles = []; rfCarrierFiles = []; rfErrors = {}; rfValidated = false; rfValidando = false;
}

function toast(msg, type) {
  var w = document.getElementById('toasts');
  var d = document.createElement('div');
  d.className = 'toast ' + (type||'info');
  d.textContent = msg;
  w.appendChild(d);
  setTimeout(function(){ d.remove(); }, 3500);
}

function getFilteredTickets() {
  var list = tickets.slice();

  if (searchQ) {
    var q = searchQ.toLowerCase();
    list = list.filter(function(t) {
      return (t.ID||'').toLowerCase().includes(q)
        || (t.titular||'').toLowerCase().includes(q)
        || (t.email_cliente||'').toLowerCase().includes(q)
        || (t.empresa||t.cliente||'').toLowerCase().includes(q)
        || (t.tipo_reclamo||'').toLowerCase().includes(q)
        || (t.detalle||'').toLowerCase().includes(q)
        || fmtDate(t.creado).includes(q);
    });
  }
  if (filtroCliente) {
    list = list.filter(function(t){ return (t.empresa||t.cliente||t.email_cliente||'') === filtroCliente; });
  }
  if (filtroEstado) {
    list = list.filter(function(t){ return (t.estado||'') === filtroEstado; });
  }
  if (filtroFechaDesde) {
    list = list.filter(function(t){ return ticketDateValue(t) >= filtroFechaDesde; });
  }
  if (filtroFechaHasta) {
    list = list.filter(function(t){ return ticketDateValue(t) <= filtroFechaHasta; });
  }
  list.sort(function(a, b) {
    if (ordenMonto) {
      var ma = parseFloat(String(a.monto||'0').replace(/[^0-9.-]/g,''))||0;
      var mb = parseFloat(String(b.monto||'0').replace(/[^0-9.-]/g,''))||0;
      return ordenMonto === 'asc' ? ma-mb : mb-ma;
    }
    var da = ticketDateValue(a), db = ticketDateValue(b);
    return ordenFecha === 'asc' ? (da < db ? -1 : da > db ? 1 : 0) : (da > db ? -1 : da < db ? 1 : 0);
  });
  return list;
}

// Devuelve la fecha del ticket en formato comparable YYYY-MM-DD
function ticketDateValue(t) {
  var str = t.creado || '';
  if (!str) return '';
  if (str.includes('/')) { var p = str.split(' ')[0].split('/'); return p.length===3 ? (p[2]+'-'+p[1]+'-'+p[0]) : str; }
  return str.slice(0,10);
}

function ejecutarBusqueda() {
  searchQ = searchInput.trim();
  render();
}

function fmtDate(str) {
  if (!str) return '—';
  if (str.includes('/')) return str;
  var d = str.slice(0,10).split('-');
  return d.length<3 ? str : d[2]+'/'+d[1]+'/'+d[0];
}

function getBC(e) {
  return {Recibido:'bn','En análisis':'ba',Finalizado:'bfin','Re abierto':'breo'}[e]||'bn';
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function fileToBase64(file) {
  return new Promise(function(res, rej) {
    var r = new FileReader();
    r.onload = function(){ res(r.result.split(',')[1]); };
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

// Muchos navegadores (sobre todo en celulares) no informan bien el tipo de
// archivo real (file.type llega vacío o como "application/octet-stream"),
// y eso hace que Drive guarde el archivo con un tipo incorrecto, generando
// el error "Excel no puede abrir el archivo" al intentar abrirlo después.
// Por eso forzamos el mimeType correcto según la extensión del nombre.
// Abre un adjunto: si ya tiene URL guardada la usa, sino pide al backend
// que setee el permiso y devuelva la URL correcta.
window.abrirAdjunto = async function(e, fileId, nombreEnc, urlDirecta) {
  e.preventDefault();
  var nombre = decodeURIComponent(nombreEnc);
  if (!fileId || fileId === 'undefined' || fileId === '') return;
  try {
    toast('Descargando archivo...', 'ok');
    var res = await api({ action:'getFileUrl', fileId:fileId, nombre:nombre });
    if (!res.ok) { toast('No se pudo obtener el archivo: ' + (res.error||''), 'err'); return; }
    // Crear un Blob local desde el base64 y forzar descarga sin pasar por Drive
    var byteChars = atob(res.base64.replace(/[\s]/g, ''));
    var byteArr = new Uint8Array(byteChars.length);
    for (var i = 0; i < byteChars.length; i++) byteArr[i] = byteChars.charCodeAt(i);
    var blob = new Blob([byteArr], { type: res.mimeType });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = res.nombre || nombre;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
  } catch(err) { toast('Error: ' + err.message, 'err'); }
};


function getMimeType(nombre) {
  var ext = (nombre.split('.').pop() || '').toLowerCase();
  var tipos = {
    xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
    xls:  'application/vnd.ms-excel',
    csv:  'text/csv',
    pdf:  'application/pdf',
    png:  'image/png',
    jpg:  'image/jpeg',
    jpeg: 'image/jpeg',
    heic: 'image/heic',
    eml:  'message/rfc822',
    msg:  'application/vnd.ms-outlook'
  };
  return tipos[ext] || 'application/octet-stream';
}

async function api(body) {
  body.token = currentUser ? currentUser.token : '';
  if (body.action === 'getTickets' && currentUser && currentUser.clientes && currentUser.clientes.length) {
    body.clientesAsignados = currentUser.clientes;
  }
  var res = await fetch(APPS_SCRIPT_URL, {
    method:'POST',
    redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(body)
  });
  return await res.json();
}

// ── LOGIN ─────────────────────────────────────────────────────
function renderLogin() {
  document.getElementById('root').innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div style="display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:18px">
          <div style="width:29px;height:29px;border-radius:7px;background:#059669;color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center">💼</div>
          <div style="text-align:left">

            <div style="font-size:10px;color:#9ca3af">Portal Comercial</div>
          </div>
        </div>
        <p>Ingresá con tu cuenta Google corporativa.</p>
        <div id="lg-err" class="lg-err" style="display:none"></div>
        <div id="google-btn" style="display:flex;justify-content:center"></div>
        <p style="font-size:10px;color:#9ca3af;margin-top:13px">Solo cuentas @${ALLOWED_DOMAIN}</p>
      </div>
    </div>`;
  if (window.google) initGoogleLogin();
}

function initGoogleLogin() {
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: async function(response) {
      var payload = JSON.parse(atob(response.credential.split('.')[1]));
      if (!payload.email.endsWith('@' + ALLOWED_DOMAIN)) {
        var err = document.getElementById('lg-err');
        if (err) { err.style.display='block'; err.textContent='Acceso restringido a cuentas @' + ALLOWED_DOMAIN; }
        return;
      }
      currentUser = { email: payload.email, name: payload.name || payload.email.split('@')[0], token: response.credential };
      loading = true;
      render();
      await loadData();
      loading = false;
      render();
    }
  });
  google.accounts.id.renderButton(document.getElementById('google-btn'), { theme:'outline', size:'large', locale:'es' });
}

async function loadData() {
  try {
    var pr = await api({ action:'getPerfilComercial' });
    perfil = pr.perfil;
    var tr = await api({ action:'getTickets', esOperario:false });
    tickets = tr.tickets || [];
    // Actualizar polling cada 60s
    setTimeout(async function(){ if(currentUser){ var r=await api({action:'getTickets',esOperario:false}); tickets=r.tickets||[]; if(activeView==='tickets') render(); } }, 60000);
  } catch(e) { console.error(e); }
}

// ── RENDER PRINCIPAL ──────────────────────────────────────────
function render() {
  if (!currentUser) { renderLogin(); return; }
  if (loading) {
    document.getElementById('root').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--g400);font-size:12px">Cargando...</div>';
    return;
  }
  renderApp();
  // El panel de detalle (.overlay) se inserta fuera de #root con
  // insertAdjacentHTML, así que render() no lo toca automáticamente.
  // Si no hay ticket seleccionado, hay que removerlo explícitamente
  // para que el botón ✕ / clic-afuera realmente cierren el panel.
  if (!selectedTicket) {
    var existingOverlay = document.querySelector('.overlay');
    if (existingOverlay) existingOverlay.remove();
  }
}

  var filtered = getFilteredTickets();

      ${(filtroCliente||filtroEstado||filtroFechaDesde||filtroFechaHasta||searchQ) ? '<button class="btn btn-ghost" onclick="filtroCliente=\'\';filtroEstado=\'\';filtroFechaDesde=\'\';filtroFechaHasta=\'\';searchQ=\'\';searchInput=\'\';render()">✕ Limpiar</button>' : ''}

  var byteChars = atob(PLANILLA_CONSUMOS_B64);
  var byteArr = new Uint8Array(byteChars.length);
  for (var i = 0; i < byteChars.length; i++) byteArr[i] = byteChars.charCodeAt(i);

// B=1 Nro tarjeta | C=2 Nro secuencia | E=4 Fecha Movimiento | F=5 Monto movimiento | J=9 Localidad
var COLS_OBLIGATORIAS = [
  { idx: 1, nombre: 'Nro tarjeta (col B)' },
  { idx: 2, nombre: 'Nro secuencia (col C)' },
  { idx: 4, nombre: 'Fecha Movimiento (col E)' },
  { idx: 5, nombre: 'Monto movimiento (col F)' },
  { idx: 9, nombre: 'Localidad (col J)' }
];

// Parsea el xlsx con SheetJS y valida que las columnas obligatorias tengan valor
// en cada fila que tenga al menos una celda con dato.
function validarColumnasPlanilla(file) {
  return new Promise(function(resolve) {
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, { type: 'array' });
        var ws = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

        if (rows.length < 2) {
          resolve({ ok: false, msg: 'La planilla no tiene filas de datos (solo el encabezado).' });
          return;
        }

        var filasFaltantes = [];
        // Fila 0 = encabezado, empezamos desde fila 1
        for (var r = 1; r < rows.length; r++) {
          var row = rows[r];
          // ¿La fila tiene algún dato? (al menos una celda no vacía)
          var tieneAlgo = row.some(function(c){ return c !== null && c !== undefined && String(c).trim() !== ''; });
          if (!tieneAlgo) continue; // fila completamente vacía, ignorar

          var faltanEnEstaFila = [];
          COLS_OBLIGATORIAS.forEach(function(col) {
            var val = row[col.idx];
            if (val === null || val === undefined || String(val).trim() === '') {
              faltanEnEstaFila.push(col.nombre);
            }
          });
          if (faltanEnEstaFila.length > 0) {
            filasFaltantes.push({ fila: r + 1, cols: faltanEnEstaFila });
          }
        }

        if (filasFaltantes.length > 0) {
          var detalles = filasFaltantes.slice(0, 5).map(function(f){
            return 'Fila ' + f.fila + ': falta ' + f.cols.join(', ');
          }).join(' | ');
          if (filasFaltantes.length > 5) detalles += ' ... y ' + (filasFaltantes.length - 5) + ' fila(s) más';
          resolve({ ok: false, msg: 'La planilla tiene campos obligatorios vacíos:\n' + detalles });
        } else {
          resolve({ ok: true });
        }
      } catch(err) {
        resolve({ ok: false, msg: 'No se pudo leer la planilla: ' + err.message });
      }
    };
    reader.readAsArrayBuffer(file);
  });
}

window.rfValidarInformacion = async function() {
  rfSaveFormState();
  rfErrors = {};
  if (!rfForm.titular) rfErrors.titular = 'Seleccioná un cliente';
  if (!rfForm.tipo_reclamo) rfErrors.tipo_reclamo = 'Seleccioná un tipo de reclamo';
  if (!rfExcelFiles.length) rfErrors.excel = 'Debés adjuntar al menos una planilla';
  if (rfForm.tipo_reclamo === 'Desconocimiento de consumo' && !rfForm.monto.trim()) rfErrors.monto = 'Campo obligatorio';

  if (Object.keys(rfErrors).length > 0) {
    rfErrors.validacion = 'Faltan completar ' + Object.keys(rfErrors).length + ' campo(s) obligatorio(s) antes de continuar.';
    rfValidated = false;
    render();
    return;
  }

  // Para Desconocimiento de consumo: validar contenido de la planilla
  if (rfForm.tipo_reclamo === 'Desconocimiento de consumo') {
    rfValidando = true; render();
    var errores = [];
    for (var i = 0; i < rfExcelFiles.length; i++) {
      var res = await validarColumnasPlanilla(rfExcelFiles[i]);
      if (!res.ok) errores.push('Archivo "' + rfExcelFiles[i].name + '": ' + res.msg);
    }
    rfValidando = false;
    if (errores.length > 0) {
      rfErrors.validacion = errores.join('\n');
      rfValidated = false;
      render();
      return;
    }
  }

  rfValidated = true;
  rfErrors = {};
  toast('Información validada correctamente ✓', 'ok');
  render();
};

  ['tipo_reclamo','detalle'].forEach(function(k){
    var el = document.getElementById('rf-'+k);

  });

window.rfAddFiles = function(tipo, input){
  var nuevos = Array.prototype.slice.call(input.files || []);
  if (!nuevos.length) return;
  if (tipo === 'excel') { rfExcelFiles = rfExcelFiles.concat(nuevos); rfValidated = false; }
  else { rfCarrierFiles = rfCarrierFiles.concat(nuevos); }
  input.value = ''; // permite volver a elegir el mismo archivo si lo saca y lo vuelve a agregar
  render();
};
window.rfRemoveFile = function(tipo, idx){
  if (tipo === 'excel') { rfExcelFiles.splice(idx,1); rfValidated = false; }
  else { rfCarrierFiles.splice(idx,1); }
  render();
};
window.rfSaveEdit = function(key, val){ rfForm[key]=val; rfEditField=null; render(); };

function rfSaveFormState() {
  ['titular','tipo_reclamo','detalle','monto'].forEach(function(k){
    var el = document.getElementById('rf-'+k); if(el) rfForm[k]=el.value;
  });
}

window.rfGoStep2 = function() {
  rfSaveFormState();
  if (!rfValidated) { toast('Primero validá la información', 'err'); return; }
  rfErrors = {};
  if (!rfForm.detalle.trim()) {
    rfErrors.detalle = 'Campo obligatorio';
    toast('Completá las observaciones antes de continuar', 'err');
    render();
    return;
  }
  rfStep=2; render();
};

window.rfSubmitForm = async function() {
  rfSaving=true; render();
  try {
    var id='REC-'+(Math.floor(Math.random()*900000)+100000);
    var payload={
      action:'crearTicket', titular:rfForm.titular, banco:rfForm.titular, tipo_reclamo:rfForm.tipo_reclamo,
      monto:rfForm.monto||'',
      detalle:rfForm.detalle||'', excel_nombre:rfExcelFiles.map(function(f){return f.name;}).join(', '),
      carrier_nombre:rfCarrierFiles.map(function(f){return f.name;}).join(', '),
      // Pide al backend que envíe el mail automático a operaciones al crear el ticket.
      // Requiere soporte en el Apps Script (ver notificarNuevoTicket en el backend).
      notificarOperaciones:true, mailOperaciones:MAIL_OPERACIONES,
      comercial_nombre: currentUser.name, comercial_email: currentUser.email
    };
    var adjuntosIniciales = [];

    if (rfExcelFiles.length) {
      for (var i = 0; i < rfExcelFiles.length; i++) {
        var f = rfExcelFiles[i];
        var b64 = await fileToBase64(f);
        var ur = await api({ action:'uploadArchivo', base64:b64, nombre:f.name, mimeType:getMimeType(f.name), ticketId:id });
        if (ur.ok) {
          if (i === 0) payload.excel_fileId = ur.fileId;
          adjuntosIniciales.push({ nombre:f.name, fileId:ur.fileId, url:ur.url||'', origen:'Comercial (planilla)', de:'comercial' });
        }
      }
    }
    if (rfCarrierFiles.length) {
      for (var j = 0; j < rfCarrierFiles.length; j++) {
        var fc = rfCarrierFiles[j];
        var b64c = await fileToBase64(fc);
        var urc = await api({ action:'uploadArchivo', base64:b64c, nombre:fc.name, mimeType:getMimeType(fc.name), ticketId:id });
        if (urc.ok) {
          if (j === 0) payload.carrier_fileId = urc.fileId;
          adjuntosIniciales.push({ nombre:fc.name, fileId:urc.fileId, url:urc.url||'', origen:'Comercial (acuse/mail)', de:'comercial' });
        }
      }
    }
    payload.adjuntosIniciales = JSON.stringify(adjuntosIniciales);

    var data=await api(payload);
    if(!data.ok) throw new Error(data.error||'Error desconocido');
    rfTicketId=data.id||id;
    rfStep=3;
    toast('Reclamo enviado correctamente','ok');
    // refrescar tickets en segundo plano para que aparezca en "Mis tickets"
    try { var tr = await api({ action:'getTickets', esOperario:false }); tickets = tr.tickets || []; } catch(e){}
  } catch(err){ toast('Error al enviar: '+err.message, 'err'); }
  rfSaving=false; render();
};

// Lista los archivos adjuntados al ticket por comercial y por operaciones
function renderAdjuntosTicket(t) {
  // Si hay adjuntos guardados con fileId (tickets nuevos), solo mostramos esos.
  // Si no (tickets viejos), mostramos excel_nombre y carrier_nombre sin link.
  var extra = Array.isArray(t.adjuntos) ? t.adjuntos : (function(){ try { return JSON.parse(t.adjuntos||'[]'); } catch(e){ return []; } })();
  var adj = [];
  if (extra.length) {
    extra.forEach(function(a){ adj.push({ nombre: a.nombre, origen: a.origen || (a.de==='operaciones'?'Operaciones':'Comercial'), fileId: a.fileId || a.id || null, url: a.url || null }); });
  } else {
    if (t.excel_nombre) adj.push({ nombre: t.excel_nombre, origen: 'Comercial (planilla)', fileId: t.excel_fileId || null, url: null });
    if (t.carrier_nombre) adj.push({ nombre: t.carrier_nombre, origen: 'Comercial (acuse/mail)', fileId: t.carrier_fileId || null, url: null });
  }

  if (adj.length === 0) return '<p style="font-size:12px;color:var(--g400)">Sin archivos adjuntos</p>';
  return adj.map(function(a){
    var fid = a.fileId||'';
    var u = a.url||'';
    return `<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--g100);border-radius:var(--rad);margin-bottom:6px;font-size:12px">
      <span>📎</span>
      ${(fid||u)
        ? `<a href="#" onclick="abrirAdjunto(event,'${fid}','${encodeURIComponent(a.nombre||'')}','${u}')" style="flex:1;color:var(--b600);text-decoration:underline;font-weight:500">${esc(a.nombre)}</a>`
        : `<span style="flex:1;color:var(--g900)">${esc(a.nombre)} <span style="color:var(--g400);font-weight:400">(sin vista previa disponible)</span></span>`}
      <span style="font-size:10px;color:var(--g400)">${esc(a.origen)}</span>
    </div>`;
  }).join('');
}

// Lista comentarios cargados sobre el ticket (de comercial u operaciones)
function renderComentarios(t) {
  var coms = Array.isArray(t.comentarios) ? t.comentarios : (function(){ try { return JSON.parse(t.comentarios||'[]'); } catch(e){ return []; } })();
  if (coms.length === 0) return '<p style="font-size:12px;color:var(--g400)">Todavía no hay comentarios</p>';
  return coms.map(function(c){
    var esOperaciones = c.de === 'operaciones';
    return `<div style="border-left:2px solid ${esOperaciones?'var(--p500)':'var(--b500)'};padding:7px 11px;margin-bottom:7px;background:${esOperaciones?'var(--p50)':'var(--b50)'};border-radius:0 var(--rad) var(--rad) 0">
      <div style="font-size:10px;font-weight:600;color:${esOperaciones?'var(--p600)':'var(--b700)'};margin-bottom:2px">${esOperaciones?'⚙️ Operaciones':'💼 Comercial'} · ${esc(c.usuario||'')} · ${esc(c.ts||'')}</div>
      <div style="font-size:12px;color:var(--g700)">${esc(c.texto||'')}</div>
      ${c.archivo ? `<div style="font-size:11px;margin-top:3px">
        <a href="#" onclick="abrirAdjunto(event,'','${encodeURIComponent(c.archivo||'')}','')" style="color:var(--b600);text-decoration:underline">📎 ${esc(c.archivo)}</a>
      </div>` : ''}
    </div>`;
  }).join('');
}

function syncDetailComentario() {
  var ta = document.getElementById('detail-comentario');
  if (ta) detailComentario = ta.value;
}

async function agregarComentarioTicket(id) {
  syncDetailComentario();
  var texto = detailComentario.trim();
  if (!texto && !detailArchivo) { toast('Escribí un comentario o adjuntá un archivo', 'err'); return; }

  saving = true; renderPanel();
  try {
    var ahora = new Date();
    var tsStr = ahora.getDate().toString().padStart(2,'0') + '/' + (ahora.getMonth()+1).toString().padStart(2,'0') + '/' + ahora.getFullYear() + ' ' + ahora.getHours().toString().padStart(2,'0') + ':' + ahora.getMinutes().toString().padStart(2,'0');
    var comentario = { de: 'comercial', usuario: currentUser.name || currentUser.email, ts: tsStr, texto: texto, archivo: detailArchivo ? detailArchivo.name : '' };

    var fileId = null;
    if (detailArchivo) {
      var b64 = await fileToBase64(detailArchivo);
      var ur = await api({ action:'uploadArchivo', base64:b64, nombre:detailArchivo.name, mimeType:getMimeType(detailArchivo.name), ticketId:id });
      if (ur.ok) fileId = ur.fileId;
      if (ur.url) comentario.archivoUrl = ur.url;
    }

    // NOTA: requiere una acción 'agregarComentario' en el backend (Apps Script)
    // que haga push del comentario al array "comentarios" del ticket y, si
    // hay archivo, lo agregue también a "adjuntos". Ver nota al final del chat.
    var res = await api({ action:'agregarComentario', id:id, comentario:comentario, fileId:fileId });
    if (!res.ok) throw new Error(res.error || 'No se pudo guardar el comentario');

    var t = tickets.find(function(x){ return x.ID===id; });
    if (t) {
      var coms = Array.isArray(t.comentarios) ? t.comentarios : (function(){ try{return JSON.parse(t.comentarios||'[]')}catch(e){return[]} })();
      coms.push(comentario);
      t.comentarios = coms;
      selectedTicket = t;
    }
    detailComentario = ''; detailArchivo = null;
    toast('Comentario agregado', 'ok');
    renderPanel();
  } catch (e) {
    toast('Error al agregar comentario: ' + e.message, 'err');
  }
  saving = false; renderPanel();
}

async function reabrirTicket(id) {
  var msg = document.getElementById('reopen-msg').value.trim();
  if (!msg) { toast('Escribí un mensaje para el operario', 'err'); return; }

  var ahora = new Date();
  var tsStr = ahora.getDate().toString().padStart(2,'0') + '/' + (ahora.getMonth()+1).toString().padStart(2,'0') + '/' + ahora.getFullYear() + ' ' + ahora.getHours().toString().padStart(2,'0') + ':' + ahora.getMinutes().toString().padStart(2,'0');

  var t = tickets.find(function(x){ return x.ID===id; });
  var hist = Array.isArray(t.historial) ? t.historial : (function(){ try{return JSON.parse(t.historial||'[]')}catch(e){return[]} })();
  hist.push({ ts: tsStr, accion: 'Re abierto por comercial — ' + msg, usuario: currentUser.email });

  try {
    var res = await api({ action:'updateTicket', id:id, campos:{ estado:'Re abierto', historial:hist } });
    if (!res.ok) throw new Error(res.error);
    t.estado = 'Re abierto';
    t.historial = hist;
    toast('Ticket re abierto', 'ok');
    selectedTicket = null;
    render();
  } catch(e) { toast('Error: ' + e.message, 'err'); }
}
